<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>Relatórios de Expedição</title></head>
<body onload="checkAuth(); carregarRelatorios()">
    <nav id="mainNav"></nav>
    <div class="container">
        
        <div id="painelGerenciamento">
            <div class="pda-ui">
                <h3 id="tituloFormRel" class="pda-title">RELATÓRIO // NOVO ARQUIVO DE EXPEDIÇÃO</h3>
                <form onsubmit="salvarRelatorio(event)">
                    <input type="hidden" id="editRelatorioId">
                    <div class="pda-grid">
                        <div class="pda-input-group">
                            <label>TIPO DE DOCUMENTO / Nº</label>
                            <input type="text" id="rNum" placeholder="Nº da Expedição" required>
                        </div>
                        <div class="pda-input-group">
                            <label>AUTOR DO REGISTRO</label>
                            <input type="text" id="rAutor" placeholder="Nome e Título do Autor" required>
                        </div>
                    </div>
                    
                    <div class="pda-input-group" style="margin-top:15px;">
                        <label>CLASSIFICAÇÃO / OBJETIVO DA MISSÃO</label>
                        <input type="text" id="rObj" placeholder="Objetivo da Missão" required>
                    </div>
                    
                    <div style="margin-top:20px;">
                        <div id="editor-container"></div>
                        <input type="hidden" id="rCol1">
                        <input type="hidden" id="rCol2">
                        <input type="hidden" id="rCol3">
                    </div>
                    <div style="display:flex; justify-content: flex-end; gap:10px; margin-top:20px; border-top: 1px solid #333; padding-top: 20px;">
                        <button type="button" id="btnCancelarRel" onclick="cancelarEdicaoRelatorio()" class="pda-btn-secondary" style="display:none;">CANCELAR EDIÇÃO</button>
                        <button type="submit" id="btnSalvarRel" class="pda-btn">SALVAR COMO NOVA VERSÃO</button>
                    </div>
                </form>
            </div>
            <h3 style="margin-top:40px; border-bottom:1px solid #333; padding-bottom:10px; color:#a5b396; font-family:'Share Tech Mono', monospace;">BASE DE DADOS PDA</h3>
            <div id="listaRelatorios"></div>
        </div>

        <div id="painelVisualizacao" style="display:none;">
            <button onclick="fecharRelatorio()" style="background:#e74c3c; width:auto; margin-bottom:20px;">&larr; VOLTAR AO ARQUIVO</button>
            
            <div class="papel-relatorio">
                <div class="relatorio-header"><span id="vNum"></span></div>
                <div class="relatorio-meta"><span id="vAutor"></span></div>
                <div class="relatorio-objetivo"><span id="vObj"></span></div>
                <div class="relatorio-body">
                    <!-- Modificado para suportar o HTML do Quill ocupando a largura total -->
                    <div id="vCol1" style="width: 100%; text-align: left; line-height: 1.6; font-size: 1.05em;"></div>
                    <div id="vCol2" style="display:none;"></div>
                    <div id="vCol3" style="display:none;"></div>
                </div>
                <div id="vCarimboEditado" class="relatorio-editado" style="display:none;">DOCUMENTO RETIFICADO POR:<br><span id="vNomeEditor"></span></div>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
    <script src="script.js"></script>

    <!-- Quill JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        /* TEMA PDA S.T.A.L.K.E.R. PARA O EDITOR */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body, .container {
            background-color: #0b0c0d !important;
            font-family: 'Share Tech Mono', monospace !important;
        }

        .pda-ui {
            background: #121314;
            border: 1px solid #2a2e2a;
            border-radius: 4px;
            padding: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            font-family: 'Share Tech Mono', monospace;
        }

        .pda-title {
            color: #a5b396;
            margin-top: 0;
            border-bottom: 2px solid #2a2e2a;
            padding-bottom: 10px;
            font-weight: normal;
            font-size: 1.3em;
        }

        .pda-grid {
            display: flex;
            gap: 20px;
        }

        .pda-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pda-input-group label {
            color: #778466;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .pda-input-group input {
            background: #0f1011 !important;
            border: 1px solid #333 !important;
            color: #a5b396 !important;
            padding: 10px !important;
            font-family: 'Share Tech Mono', monospace !important;
        }

        .pda-btn {
            background: #2a3622 !important;
            color: #a5b396 !important;
            border: 1px solid #4a5c40 !important;
            font-family: 'Share Tech Mono', monospace !important;
            padding: 10px 20px !important;
            width: auto !important;
        }
        
        .pda-btn:hover {
            background: #3e5033 !important;
            color: #fff !important;
        }

        .pda-btn-secondary {
            background: transparent !important;
            color: #888 !important;
            border: 1px solid #333 !important;
            font-family: 'Share Tech Mono', monospace !important;
            padding: 10px 20px !important;
            width: auto !important;
        }

        .ql-toolbar.ql-snow {
            background: #181a1b;
            border: 1px solid #333 !important;
            border-bottom: 2px solid #4a5c40 !important;
            border-radius: 4px 4px 0 0;
            padding: 8px !important;
        }
        .ql-container.ql-snow {
            background: #0f1011;
            border: 1px solid #333 !important;
            border-top: none !important;
            border-radius: 0 0 4px 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            color: #a5b396;
        }
        
        /* Ícones da Toolbar */
        .ql-snow .ql-stroke { stroke: #888; }
        .ql-snow .ql-fill { fill: #888; }
        .ql-snow .ql-picker { color: #888; }
        .ql-snow.ql-toolbar button:hover .ql-stroke, 
        .ql-snow .ql-toolbar button:hover .ql-stroke, 
        .ql-snow.ql-toolbar button.ql-active .ql-stroke, 
        .ql-snow .ql-toolbar button.ql-active .ql-stroke {
            stroke: #a5b396 !important;
        }
        .ql-snow.ql-toolbar button:hover .ql-fill, 
        .ql-snow .ql-toolbar button:hover .ql-fill, 
        .ql-snow.ql-toolbar button.ql-active .ql-fill, 
        .ql-snow .ql-toolbar button.ql-active .ql-fill {
            fill: #a5b396 !important;
        }

        .ql-editor { 
            min-height: 400px; 
            padding: 20px;
            font-family: 'Share Tech Mono', monospace !important;
            font-size: 1.1rem !important;
            color: #a5b396 !important;
        }

        .ql-editor.ql-blank::before {
            color: rgba(165, 179, 150, 0.4) !important;
            font-family: 'Share Tech Mono', monospace !important;
            font-style: italic;
        }
        
        /* Elementos dentro do editor */
        .ql-editor h1, .ql-editor h2, .ql-editor h3 {
            color: #e67e22 !important; /* Laranja de aviso */
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace !important;
        }
        
        .ql-editor blockquote {
            background: rgba(230, 126, 34, 0.05) !important;
            border-left: 4px solid #e67e22 !important;
            border-radius: 0 4px 4px 0 !important;
            padding: 15px !important;
            margin: 15px 0 !important;
            color: #d35400 !important;
            font-style: normal !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
        
        .ql-editor pre.ql-syntax {
            background: #080808;
            border: 1px solid #222;
            border-left: 3px solid #a5b396;
            color: #a5b396;
            padding: 15px;
            margin: 15px 0;
        }

        .ql-editor img { max-width: 100%; border-radius: 2px; border: 1px solid #333; opacity: 0.9; }

        /* Estilos do relatório quando impresso na tela (visualização) */
        .papel-relatorio {
            background: #0f1011 !important;
            border: 2px solid #333 !important;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            color: #a5b396 !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
        .papel-relatorio .relatorio-header { color: #a5b396; border-bottom: 2px solid #4a5c40; }
        .papel-relatorio .relatorio-meta { color: #888; }
        .papel-relatorio .relatorio-objetivo { background: rgba(0,0,0,0.5); border-left: 4px solid #e67e22; color: #e67e22; }
        .papel-relatorio h1, .papel-relatorio h2 { color: #e67e22; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top:20px; }
        .papel-relatorio p { margin-bottom: 10px; }
        .papel-relatorio ul, .papel-relatorio ol { margin-left: 25px; margin-bottom: 15px; }
        .papel-relatorio blockquote { background: rgba(230,126,34,0.05); border-left: 4px solid #e67e22; padding: 15px; color: #d35400; font-style: normal; }
    </style>
    <script>
        const quillRel = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'align': [] }],
                    ['blockquote', 'code-block', 'link', 'image'],
                    ['clean']
                ]
            },
            placeholder: 'Redija o relatório técnico aqui...'
        });

        // Hook on submit
        const formRel = document.querySelector('form[onsubmit="salvarRelatorio(event)"]');
        formRel.addEventListener('submit', function(e) {
            document.getElementById('rCol1').value = quillRel.root.innerHTML;
            document.getElementById('rCol2').value = '';
            document.getElementById('rCol3').value = '';
        });

        // Hook prepareEdit
        const originalPrepararRel = window.prepararEdicaoRel;
        window.prepararEdicaoRel = function(id) {
            originalPrepararRel(id);
            const r = window.relatoriosAtuais.find(rel => rel.id === id);
            if (r) {
                // Se tiver conteúdo antigo nas colunas 2 e 3, joga tudo pro Quill para não perder
                let content = r.col1 || '';
                if (r.col2) content += '<br><br>' + r.col2;
                if (r.col3) content += '<br><br>' + r.col3;
                quillRel.root.innerHTML = content;
            }
        };

        // Hook view mode
        const originalAbrirVisualizacaoRel = window.abrirVisualizacaoRel;
        window.abrirVisualizacaoRel = function(id) {
            originalAbrirVisualizacaoRel(id);
            const r = window.relatoriosAtuais.find(rel => rel.id === id);
            if (r) {
                // Render content properly as HTML
                document.getElementById('vCol1').innerHTML = r.col1 || '';
                if (r.col2) {
                    document.getElementById('vCol1').innerHTML += '<br><br>' + r.col2;
                }
                if (r.col3) {
                    document.getElementById('vCol1').innerHTML += '<br><br>' + r.col3;
                }
            }
        };
    </script>
</body>
</html>
