<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-control.css"><title>OPERAÇÕES DA ZONA</title>
<style>
.ctrl-wrap{max-width:1320px;margin:28px auto 70px;padding:42px 18px 20px}
.ctrl-hero{border:1px solid #17314d;border-top:3px solid #3498db;background:linear-gradient(125deg,#03070b,#071421);padding:22px;margin-bottom:14px}
.ctrl-hero h1{margin:4px 0;color:#60a5fa;letter-spacing:2px}.ctrl-hero p{color:#718096;margin:0}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.ctrl-card{background:#03070b;border:1px solid #17314d;padding:15px}
.ctrl-card h3{color:#60a5fa;margin-top:0}.ctrl-form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ctrl-form .full{grid-column:1/-1}.ctrl-form label{font-size:11px;color:#8aa0b5;display:block;margin-bottom:4px;letter-spacing:1px}
.ctrl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ctrl-actions button{width:auto}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{border:1px solid #17314d;background:#03070b;padding:15px;text-align:center}.stat b{display:block;font-size:25px;color:#60a5fa}.stat small{color:#6f8498}
.badge2{display:inline-block;padding:3px 7px;border:1px solid #31506d;color:#9cc8ec;font-size:10px;margin:2px}
@media(max-width:760px){.ctrl-form{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}}
</style>
</head><body class="admin-control-body"><nav id="mainNav"></nav><div class="admin-control-shell"><aside id="adminRail" class="admin-rail"></aside><main class="admin-main"><div class="ctrl-wrap"><section class="ctrl-hero"><div style="font-size:11px;letter-spacing:3px;color:#3498db">GLOBAL COMMAND / ADMINISTRATOR</div><h1>OPERAÇÕES DA ZONA</h1><p>Missões, contratos, quests e experimentos do servidor em uma visão operacional.</p></section><div id="ops" class="ctrl-grid"></div><div class="ctrl-actions"><button class="btn-success" onclick="location.href='/admin-quests.html'">EDITOR DE QUESTS</button><button class="btn-secondary" onclick="location.href='/missoes.html'">MISSÕES</button><button class="btn-secondary" onclick="location.href='/contratos.html'">CONTRATOS</button></div></div></main></div><script src="app.js"></script><script src="admin-control.js"></script><script>
function group(title,rows){return `<section class="ctrl-card"><h3>${title}</h3>${(rows||[]).map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #17314d;padding:7px"><span>${escapeHtml(x.status||'SEM STATUS')}</span><b>${x.qty}</b></div>`).join('')||'<p>Sem registros.</p>'}</section>`}
async function init(){checkAuth();mountAdminRail('operations');injectNav('/admin-operations.html');const d=await api('/api/admin/operations-overview');ops.innerHTML=group('MISSÕES',d.missions)+group('CONTRATOS',d.contracts)+group('QUESTS',d.quests)+group('EXPERIMENTOS',d.experiments)}
init();
</script></body></html>
