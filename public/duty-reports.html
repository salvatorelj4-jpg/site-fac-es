<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="special-factions.css"><title>Relatórios Duty</title></head><body><nav id="mainNav"></nav><main class="sf-wrap"><div class="sf-hero" id="sfCode" data-code=""><div class="sf-kicker"></div><h1 class="sf-title">RELATÓRIOS DE COMANDO</h1><p class="sf-sub">Debriefings, resultados de missão e observações do comando</p></div><div id="reportList" class="sf-grid"></div></main><script>window.SF_PAGE={faction:'duty'};</script><script src="app.js"></script><script src="special-factions.js"></script><script>sfInit();api('/api/relatorios').then(rows=>{reportList.innerHTML=(rows||[]).map(r=>`<div class="sf-card"><span class="sf-tag">REL ${sfEsc(r.numero||r.id)}</span><h3>${sfEsc(r.objetivo||'Debriefing')}</h3><p><b>Oficial:</b> ${sfEsc(r.autor||'-')}</p><p><b>Unidade:</b> ${sfEsc(r.membros||'-')}</p><div class="sf-meta">${sfEsc(r.col1||'')} ${sfEsc(r.col2||'')} ${sfEsc(r.col3||'')}</div></div>`).join('')||'<div class="sf-empty">Nenhum relatório.</div>'});</script></body></html>
