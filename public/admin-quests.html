<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-control.css"><title>EDITOR GLOBAL DE QUESTS</title>
<style>
.ctrl-wrap{max-width:1320px;margin:28px auto 70px;padding:42px 18px 20px}
.ctrl-hero{border:1px solid #17314d;border-top:3px solid #3498db;background:linear-gradient(125deg,#03070b,#071421);padding:22px;margin-bottom:14px}
.ctrl-hero h1{margin:4px 0;color:#60a5fa;letter-spacing:2px}.ctrl-hero p{color:#718096;margin:0}
.ctrl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.ctrl-card{background:#03070b;border:1px solid #17314d;padding:15px}
.ctrl-card h3{color:#60a5fa;margin-top:0}.ctrl-form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ctrl-form .full{grid-column:1/-1}.ctrl-form label{font-size:11px;color:#8aa0b5;display:block;margin-bottom:4px;letter-spacing:1px}
.ctrl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ctrl-actions button{width:auto}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat{border:1px solid #17314d;background:#03070b;padding:15px;text-align:center}.stat b{display:block;font-size:25px;color:#60a5fa}.stat small{color:#6f8498}
.badge2{display:inline-block;padding:3px 7px;border:1px solid #31506d;color:#9cc8ec;font-size:10px;margin:2px}
@media(max-width:760px){.ctrl-form{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}}
</style>
</head><body class="admin-control-body"><nav id="mainNav"></nav><div class="admin-control-shell"><aside id="adminRail" class="admin-rail"></aside><main class="admin-main"><div class="ctrl-wrap"><section class="ctrl-hero"><div style="font-size:11px;letter-spacing:3px;color:#3498db">GLOBAL COMMAND / ADMINISTRATOR</div><h1>EDITOR GLOBAL DE QUESTS</h1><p>Crie, encadeie e altere objetivos e recompensas. A estrutura fica pronta para integração automática com eventos do DayZ.</p></section>
<div class="ctrl-actions"><button class="btn-success" onclick="openQuest()">+ NOVA QUEST</button><button class="btn-secondary" onclick="location.href='/admin-operations.html'">OPERAÇÕES</button></div>
<section id="qForm" class="ctrl-card hidden" style="margin-top:12px"><input id="qId" type="hidden"><h3 id="qFormTitle">NOVA QUEST</h3><div class="ctrl-form">
<div><label>CÓDIGO</label><input id="qCode" placeholder="QST-ECO-001"></div><div><label>TÍTULO</label><input id="qTitle"></div>
<div><label>FACÇÃO</label><select id="qFaction"></select></div><div><label>NPC / QUEST GIVER</label><input id="qGiver"></div>
<div><label>STATUS</label><select id="qStatus"><option>DRAFT</option><option>ACTIVE</option><option>PAUSED</option><option>CLOSED</option><option>ARCHIVED</option></select></div><div><label>QUEST ANTERIOR</label><select id="qPrereq"></select></div>
<div><label><input id="qRepeat" type="checkbox"> REPETÍVEL</label></div><div><label>COOLDOWN (HORAS)</label><input id="qCooldown" type="number" min="0" value="0"></div>
<div class="full"><label>DESCRIÇÃO</label><textarea id="qDesc" rows="4"></textarea></div><div class="full"><label>IMAGEM OPCIONAL</label><input id="qImage" type="file" accept="image/*"></div>
</div><hr><h3>OBJETIVOS</h3><div id="reqRows"></div><button class="btn-secondary w-auto" onclick="addReq()">+ OBJETIVO</button>
<hr><h3>RECOMPENSAS</h3><div class="ctrl-form"><div><label>RU</label><input id="rwMoney" type="number" min="0" value="0"></div><div><label>REPUTAÇÃO</label><input id="rwRep" type="number" value="0"></div><div><label>ITEM DO CATÁLOGO</label><select id="rwItem"></select></div><div><label>QUANTIDADE</label><input id="rwQty" type="number" min="1" value="1"></div><div class="full"><label>OBSERVAÇÃO / ACESSO DESBLOQUEADO</label><input id="rwUnlock"></div></div>
<div class="ctrl-actions"><button class="btn-success" onclick="saveQuest()">SALVAR QUEST</button><button class="btn-secondary" onclick="qForm.classList.add('hidden')">CANCELAR</button></div></section>
<div id="questList" class="ctrl-grid" style="margin-top:14px"></div>
</div></main></div><script src="app.js"></script><script src="admin-control.js"></script><script>
let quests=[],factions=[],items=[];
async function init(){checkAuth();mountAdminRail('quests');injectNav('/admin-quests.html');[quests,factions,items]=await Promise.all([api('/api/quests'),api('/api/factions'),api('/api/trade-catalog?channel=ADMIN')]);qFaction.innerHTML='<option value="">GLOBAL / TODAS</option>'+factions.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');rwItem.innerHTML='<option value="">SEM ITEM</option>'+items.map(i=>`<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('');refreshPrereq();render()}
function refreshPrereq(){qPrereq.innerHTML='<option value="">NENHUMA</option>'+quests.map(q=>`<option value="${q.id}">${escapeHtml(q.code)} — ${escapeHtml(q.title)}</option>`).join('')}
function addReq(r={type:'DELIVER_ITEM',target:'',quantity:1,extra:''}){const d=document.createElement('div');d.className='ctrl-card req';d.innerHTML=`<div class="ctrl-form"><div><label>TIPO</label><select class="rType"><option>DELIVER_ITEM</option><option>KILL_MUTANT</option><option>KILL_INFECTED</option><option>VISIT_LOCATION</option><option>COLLECT_ARTIFACT</option><option>TALK_NPC</option><option>BUY_ITEM</option><option>SELL_ITEM</option><option>REPUTATION_MIN</option><option>COMPLETE_QUEST</option><option>DELIVER_MONEY</option></select></div><div><label>ALVO / ITEM / MUTANTE / LOCAL</label><input class="rTarget"></div><div><label>QUANTIDADE</label><input class="rQty" type="number" min="1"></div><div><label>DETALHES</label><input class="rExtra"></div></div><button class="btn-danger w-auto" onclick="this.parentElement.remove()">REMOVER</button>`;reqRows.appendChild(d);d.querySelector('.rType').value=r.type||'DELIVER_ITEM';d.querySelector('.rTarget').value=r.target||'';d.querySelector('.rQty').value=r.quantity||1;d.querySelector('.rExtra').value=r.extra||''}
function collectReq(){return [...document.querySelectorAll('.req')].map(d=>({type:d.querySelector('.rType').value,target:d.querySelector('.rTarget').value.trim(),quantity:Number(d.querySelector('.rQty').value||1),extra:d.querySelector('.rExtra').value.trim()}))}
function openQuest(q=null){qId.value=q?.id||'';qFormTitle.textContent=q?'EDITAR QUEST':'NOVA QUEST';qCode.value=q?.code||'';qTitle.value=q?.title||'';qFaction.value=q?.faction_id||'';qGiver.value=q?.quest_giver||'';qStatus.value=q?.status||'DRAFT';qPrereq.value=q?.prerequisite_quest_id||'';qRepeat.checked=!!q?.repeatable;qCooldown.value=q?.cooldown_hours||0;qDesc.value=q?.description||'';qImage.value='';reqRows.innerHTML='';(q?.requirements||[]).forEach(addReq);if(!(q?.requirements||[]).length)addReq();const rw=q?.rewards||{};rwMoney.value=rw.money||0;rwRep.value=rw.reputation||0;rwItem.value=rw.item_id||'';rwQty.value=rw.item_qty||1;rwUnlock.value=rw.unlock||'';qForm.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
async function saveQuest(){const fd=new FormData();fd.append('code',qCode.value.trim());fd.append('title',qTitle.value.trim());fd.append('faction_id',qFaction.value);fd.append('quest_giver',qGiver.value.trim());fd.append('status',qStatus.value);fd.append('prerequisite_quest_id',qPrereq.value);fd.append('repeatable',qRepeat.checked?1:0);fd.append('cooldown_hours',qCooldown.value||0);fd.append('description',qDesc.value.trim());fd.append('requirements',JSON.stringify(collectReq()));fd.append('rewards',JSON.stringify({money:Number(rwMoney.value||0),reputation:Number(rwRep.value||0),item_id:rwItem.value?Number(rwItem.value):null,item_qty:Number(rwQty.value||1),unlock:rwUnlock.value.trim()}));if(qImage.files[0])fd.append('image',qImage.files[0]);await apiForm(qId.value?`/api/admin/quests/${qId.value}`:'/api/admin/quests',fd,qId.value?'PUT':'POST');showSuccess('Quest salva.');qForm.classList.add('hidden');quests=await api('/api/quests');refreshPrereq();render()}
function render(){questList.innerHTML=quests.map(q=>`<article class="ctrl-card">${q.image?`<img src="${escapeHtml(q.image)}" style="width:100%;height:150px;object-fit:cover">`:''}<span class="badge2">${escapeHtml(q.status)}</span><span class="badge2">${escapeHtml(q.faction_name||'GLOBAL')}</span><h3>${escapeHtml(q.code)} — ${escapeHtml(q.title)}</h3><p>${escapeHtml(q.description||'')}</p><p><b>Objetivos:</b> ${(q.requirements||[]).length}<br><b>NPC:</b> ${escapeHtml(q.quest_giver||'-')}<br><b>Repetível:</b> ${q.repeatable?'Sim':'Não'}</p><div class="ctrl-actions"><button class="btn-secondary" onclick='openQuest(${JSON.stringify(q).replace(/'/g,"&#39;")})'>EDITAR</button>${getUser().role==='super_admin'?`<button class="btn-danger" onclick="delQ(${q.id})">EXCLUIR</button>`:''}</div></article>`).join('')||'<p>Nenhuma quest.</p>'}
async function delQ(id){if(!confirm('Excluir quest e progresso associado?'))return;await api(`/api/admin/quests/${id}`,{method:'DELETE'});quests=await api('/api/quests');refreshPrereq();render()}
init();
</script></body></html>
