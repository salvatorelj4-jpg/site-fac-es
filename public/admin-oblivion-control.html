<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-control.css"><title>Comércio & Traders — V1.7.1</title></head>
<body class="admin-control-body" onload="init()"><nav id="mainNav"></nav><div class="admin-control-shell"><aside id="adminRail" class="admin-rail"></aside><main class="admin-main"><section class="admin-hero"><div class="admin-eyebrow">Oblivion Control V1.7.1</div><h1>COMÉRCIO &amp; TRADERS</h1><p>Salvar altera apenas o draft. Publicar gera uma release pendente; somente o bridge autorizado pode aplicar os JSONs.</p></section><section class="admin-status-strip"><div class="admin-status-cell"><small>Bridge</small><b id="bridge">CARREGANDO</b></div><div class="admin-status-cell"><small>Servidor</small><b id="serverId">—</b></div><div class="admin-status-cell"><small>Release atual</small><b id="release">—</b></div><div class="admin-status-cell"><small>Último heartbeat</small><b id="heartbeat">—</b></div></section><section class="admin-card"><label>Trader <select id="trader"></select></label><button class="admin-btn primary" onclick="newDraft()">NOVO DRAFT</button><button class="admin-btn" onclick="validateDraft()">VALIDAR</button><button class="admin-btn success" onclick="publishDraft()">PUBLICAR</button><span id="notice"></span><div class="admin-inline-filter"><input id="search" placeholder="Buscar classname ou nome" oninput="render()"></div><div id="items" class="admin-table-wrap"></div></section><section class="admin-card"><h2>RELEASES</h2><div id="releases"></div></section></main></div><script src="app.js"></script><script src="admin-control.js"></script><script>
let draft=null,items=[],runtimeStatusTimer=null,runtimeStatusInFlight=false,lastValidRuntimeStatus=null;const $=id=>document.getElementById(id);const say=t=>$('notice').textContent=t;async function obc(url,opt={}){return api('/api/oblivion'+url,opt)}
function renderRuntimeStatus(s,temporarilyUnavailable=false){document.querySelector('.admin-status-strip').innerHTML=`<div class="admin-status-cell"><small>Painel</small>${adminStateBadge(s.panel)}</div><div class="admin-status-cell"><small>Servidor DayZ</small>${adminStateBadge(s.dayzServer.status)}</div><div class="admin-status-cell"><small>Bridge</small>${adminStateBadge(s.bridge.status)}</div><div class="admin-status-cell"><small>Qonzer</small>${adminStateBadge(s.qonzer.status)}</div><div class="admin-status-cell"><small>Workshop</small>${adminStateBadge(s.workshop.status)}</div><div class="admin-status-cell"><small>Último heartbeat</small><b>${s.bridge.lastHeartbeatAt?formatDateTime(s.bridge.lastHeartbeatAt):'—'}${temporarilyUnavailable?' • DADOS TEMPORARIAMENTE INDISPONÍVEIS':''}</b></div><div class="admin-status-cell"><small>Release atual</small><b>${escapeHtml(lastValidRuntimeStatus?.legacyRelease||'—')}</b></div>`}
async function init(){checkAuth();injectNav('/admin-oblivion-control.html');mountAdminRail('commerce');await Promise.all([loadTraders(),loadStatus(),loadReleases()]);if(runtimeStatusTimer)clearInterval(runtimeStatusTimer);runtimeStatusTimer=setInterval(()=>{if(!runtimeStatusInFlight)loadStatus()},15000);window.addEventListener('beforeunload',()=>{if(runtimeStatusTimer)clearInterval(runtimeStatusTimer)},{once:true})}
async function loadTraders(){const d=await obc('/traders');$('trader').innerHTML=d.traders.map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)} — ${escapeHtml(t.id)}</option>`).join('');await loadItems()}
async function loadItems(){items=(await obc(`/traders/${encodeURIComponent($('trader').value)}/items`)).items;render()}
function render(){const q=$('search').value.toLowerCase();const list=items.filter(x=>[x.className,x.displayName,x.category].join(' ').toLowerCase().includes(q));$('items').innerHTML=`<table class="admin-table"><thead><tr><th>Item</th><th>Categoria</th><th>Compra</th><th>Venda</th><th>Ativo</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${escapeHtml(x.displayName||x.className)}</b><br><code>${escapeHtml(x.className)}</code></td><td>${escapeHtml(x.category||'GERAL')}</td><td><input id="buy-${x.id}" type="number" min="0" value="${Number(x.baseBuyPrice||0)}"></td><td><input id="sell-${x.id}" type="number" min="0" value="${Number(x.baseSellPrice||0)}"></td><td><input id="enabled-${x.id}" type="checkbox" ${x.enabled?'checked':''}></td><td><button class="admin-btn" onclick="save('${x.id}')">SALVAR</button></td></tr>`).join('')}</tbody></table>`}
async function newDraft(){draft=await obc('/drafts',{method:'POST',body:{traderId:$('trader').value}});say(`Draft ${draft.draftId}`)}
async function save(id){if(!draft)return say('Crie um draft primeiro.');await obc(`/drafts/${draft.draftId}/items/${encodeURIComponent(id)}`,{method:'PATCH',body:{enabled:$('enabled-'+id).checked,buyPrice:Number($('buy-'+id).value||0),sellPrice:Number($('sell-'+id).value||0)}});say('Alteração salva no draft.')}
async function validateDraft(){if(!draft)return say('Crie um draft primeiro.');draft=await obc(`/drafts/${draft.draftId}/validate`,{method:'POST'});say('Draft validado.')}
async function publishDraft(){if(!draft)return say('Crie um draft primeiro.');const r=await obc(`/drafts/${draft.draftId}/publish`,{method:'POST'});say(`Release criada. Aguardando sincronização com o servidor DayZ. (${r.releaseId})`);await loadReleases()}
async function loadStatus(){if(runtimeStatusInFlight)return;runtimeStatusInFlight=true;try{const [legacy,s]=await Promise.all([obc('/bridge/status'),api('/api/oblivion/admin/runtime-status')]);if(!s||!s.bridge||!s.dayzServer||!s.qonzer||!s.workshop)throw new Error('INVALID_RUNTIME_STATUS');lastValidRuntimeStatus={...s,legacyRelease:legacy.currentReleaseId||'—'};renderRuntimeStatus(lastValidRuntimeStatus)}catch(_){renderRuntimeStatus(lastValidRuntimeStatus||{panel:'ONLINE',dayzServer:{status:'UNKNOWN'},bridge:{status:'NEVER_CONNECTED'},qonzer:{status:'UNKNOWN'},workshop:{status:'PUBLISHED'}},true)}finally{runtimeStatusInFlight=false}}
async function loadReleases(){const d=await obc('/releases');$('releases').innerHTML=d.releases.map(r=>`<div class="admin-card"><b>${escapeHtml(r.releaseId)}</b> ${adminStateBadge(r.status)}<button class="admin-btn warn" onclick="rollback('${r.releaseId}')">SOLICITAR ROLLBACK</button></div>`).join('')||'<p>Nenhuma release.</p>'}
async function rollback(id){if(!confirm('Solicitar rollback ao bridge? O painel não restaura arquivos diretamente.'))return;await obc(`/releases/${encodeURIComponent(id)}/rollback-request`,{method:'POST'});say('Rollback solicitado ao bridge.');await loadReleases()}
$('trader').onchange=loadItems;
</script></body></html>
