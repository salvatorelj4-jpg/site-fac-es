<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="special-factions.css"><title>AQUISIÇÕES CIENTÍFICAS</title></head><body><nav id="mainNav"></nav><main class="sf-wrap commerce-wrap"><section class="sf-hero commerce-hero" data-code="ECOLOGISTS // COMMERCE"><div class="sf-kicker">ECOLOGISTS / POSTO DE AQUISIÇÕES</div><h1 class="sf-title">AQUISIÇÕES CIENTÍFICAS</h1><p class="sf-sub">Compra de artefatos, amostras, equipamentos e recompensas de campo.</p></section><section class="sf-panel commerce-form"><h2 class="sf-title" style="font-size:19px">NOVA TRANSAÇÃO</h2><div class="sf-form"><div class="full"><label>PESSOA CADASTRADA</label><select id="commercePerson" onchange="sfCommercePersonChanged()"><option value="">Selecione...</option></select></div><div id="commercePersonInfo" class="full commerce-person-card hidden"></div><div><label>OPERAÇÃO</label><select id="commerceOperation" onchange="sfCommerceOperationChanged()"><option value="FACCAO_COMPRA">FACÇÃO COMPRA DA PESSOA</option><option value="FACCAO_VENDE">FACÇÃO VENDE PARA A PESSOA</option><option value="RECOMPENSA">RECOMPENSA / ENTREGA RP</option></select></div><div><label>MODO DE RECOMPENSA</label><select id="commerceRewardMode" onchange="sfCommerceRewardModeChanged()"><option value="both">RU + REPUTAÇÃO</option><option value="money">SOMENTE RU</option><option value="rep">SOMENTE REPUTAÇÃO</option></select></div><div class="full"><label>ITEM DO CATÁLOGO GLOBAL</label><select id="commerceCatalog" onchange="sfCommerceCatalogChanged()"><option value="">Selecione um item cadastrado...</option></select></div><div class="full"><label>ARTEFATO / AMOSTRA / EQUIPAMENTO</label><input id="commerceMerch" placeholder="Identificação da mercadoria / serviço RP"></div><div><label>QUANTIDADE</label><input id="commerceQty" type="number" min="0.01" step="0.01" value="1"></div><div><label id="commerceMoneyLabel">VALOR / PAGAMENTO (RU)</label><input id="commerceMoney" type="number" min="0" step="0.01" value="0"></div><div><label>REPUTAÇÃO CONCEDIDA</label><input id="commerceRep" type="number" min="0" step="1" value="0"></div><div class="full"><label>OBSERVAÇÕES</label><textarea id="commerceNotes" rows="3" placeholder="Contexto RP, condição da mercadoria, acordo ou observações..."></textarea></div></div><div id="commercePreview" class="commerce-preview"></div><button class="btn-success" onclick="sfCommerceSave()">REGISTRAR TRANSAÇÃO</button></section><section class="sf-panel"><div class="d-flex justify-between align-center"><div><h2 class="sf-title" style="font-size:19px">HISTÓRICO COMERCIAL</h2><p class="sf-sub">Movimentações vinculadas às pessoas cadastradas.</p></div></div><div id="commerceHistory" class="sf-grid"></div></section></main><script>window.SF_PAGE={faction:'ecologists',module:'trade',commerce:true};</script><script src="app.js"></script><script src="special-factions.js"></script><script>sfCommerceInit();</script></body></html>
