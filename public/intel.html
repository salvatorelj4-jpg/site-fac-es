<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"><title>Centro de Inteligência Tática</title>
<style>
.intel-wrap{max-width:1200px;margin:28px auto}.intel-hero{background:linear-gradient(120deg,#02070d,#071321);border:1px solid #17314d;border-top:3px solid #3b82f6;padding:24px;position:relative;overflow:hidden}.intel-hero:after{content:'TACTICAL INTELLIGENCE NETWORK';position:absolute;right:18px;top:12px;color:#132d46;font-size:.72em;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{background:#03070b;border:1px solid #17314d;padding:16px;text-align:center}.stat b{display:block;color:#60a5fa;font-size:2em}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}.intel-list{display:grid;gap:14px}.intel-card{background:linear-gradient(145deg,#04090f,#020508);border:1px solid #17314d;padding:20px;position:relative}.intel-card:before{content:'INTELLIGENCE REPORT';position:absolute;right:12px;top:10px;color:#132d46;font-size:.7em;letter-spacing:2px}.code{color:#60a5fa;letter-spacing:3px;font-size:.9em}.badge{display:inline-block;padding:4px 9px;border:1px solid #294b70;margin:4px 6px 4px 0;font-size:.8em}.secret{border-color:#7f1d1d;color:#f87171}.conf{border-color:#854d0e;color:#fbbf24}.critical{border-color:#991b1b;color:#f87171}.high{border-color:#854d0e;color:#fbbf24}.intel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.intel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tactical-note{border-left:3px solid #3b82f6;background:rgba(59,130,246,.06);padding:10px;margin-top:10px}.summary-box{background:#06101a;border:1px solid #142b42;padding:10px;margin-top:10px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}.intel-grid{grid-template-columns:1fr}}
</style>
</head>
<body onload="initIntelCenter()"><nav id="mainNav"></nav>
<div class="container intel-wrap">
<div class="intel-hero"><div class="code">MERCENARY SYNDICATE / SECURE CHANNEL</div><h2 style="color:#60a5fa;margin:8px 0">◈ CENTRO DE INTELIGÊNCIA TÁTICA</h2><p class="text-muted">Monitoramento de alvos, fontes, ameaças e informações estratégicas.</p><button id="newIntelBtn" class="btn-success w-auto" onclick="openIntelForm()">+ NOVO INFORME</button></div>
<div class="stats"><div class="stat"><b id="iNew">0</b>NOVOS</div><div class="stat"><b id="iAnalysis">0</b>EM ANÁLISE</div><div class="stat"><b id="iConfirmed">0</b>CONFIRMADOS</div><div class="stat"><b id="iArchived">0</b>ARQUIVADOS</div></div>
<div class="toolbar"><input id="iSearch" placeholder="Buscar por código, título, alvo ou fonte..." oninput="renderIntel()"><select id="iClassFilter" onchange="renderIntel()"><option value="">TODAS CLASSIFICAÇÕES</option><option>PUBLICO</option><option>RESTRITO</option><option>CONFIDENCIAL</option><option>SIGILOSO</option></select><select id="iStatusFilter" onchange="renderIntel()"><option value="">TODOS STATUS</option><option>NOVO</option><option>ANALISANDO</option><option>CONFIRMADO</option><option>ARQUIVADO</option></select><select id="iPriorityFilter" onchange="renderIntel()"><option value="">TODAS PRIORIDADES</option><option>BAIXA</option><option>MEDIA</option><option>ALTA</option><option>CRITICA</option></select></div>
<div id="intelForm" class="card hidden"><h3 id="intelFormTitle" class="text-accent">NOVO INFORME</h3><input id="fTitle" placeholder="Título do informe"><div class="intel-grid"><select id="fClass"><option>PUBLICO</option><option>RESTRITO</option><option>CONFIDENCIAL</option><option>SIGILOSO</option></select><select id="fPriority"><option>BAIXA</option><option selected>MEDIA</option><option>ALTA</option><option>CRITICA</option></select></div><div class="intel-grid"><input id="fTarget" placeholder="Alvo / Fonte"><input id="fArea" placeholder="Área / Região"></div><input id="fReliability" placeholder="Confiabilidade (ex.: Alta, 80%, fonte validada)"><textarea id="fSummary" rows="3" placeholder="Resumo executivo"></textarea><textarea id="fContent" rows="6" placeholder="Conteúdo completo do informe"></textarea><textarea id="fNotes" rows="3" placeholder="Observações táticas"></textarea><div class="d-flex gap-1"><button class="btn-success" onclick="saveIntel()">SALVAR INFORME</button><button class="btn-secondary" onclick="closeIntelForm()">CANCELAR</button></div></div>
<div id="intelList" class="intel-list"></div></div>
<script src="app.js"></script>
<script>
let intelRows=[],editingIntel=null;function me(){return getUser()}function isLeader(){const u=me();return u&&(u.role==='super_admin'||u.role==='faction_admin')}function canCreate(){const u=me();return u&&(u.role==='super_admin'||['operator','commander','faction_admin'].includes(u.role))}function canEdit(r){return me().role==='super_admin'||r.created_by===me().id}
async function initIntelCenter(){const u=checkAuth();if(!u)return;if(u.role!=='super_admin'&&u.factionSlug!=='mercenaries'){location.href='/unauthorized.html';return}if(!canCreate())newIntelBtn.style.display='none';await loadIntel()}
function openIntelForm(r=null){if(!canCreate())return showError('Seu cargo não pode criar informes.');editingIntel=r?.id||null;intelFormTitle.textContent=editingIntel?`EDITAR ${r.intel_code}`:'NOVO INFORME';fTitle.value=r?.title||'';fClass.value=r?.category||'RESTRITO';fPriority.value=r?.extra?.priority||'MEDIA';fTarget.value=r?.subject||'';fArea.value=r?.location||'';fReliability.value=r?.extra?.reliability||'';fSummary.value=r?.extra?.summary||'';fContent.value=r?.description||'';fNotes.value=r?.extra?.tacticalNotes||'';intelForm.classList.remove('hidden')}
function closeIntelForm(){editingIntel=null;intelForm.classList.add('hidden')}
async function saveIntel(){const current=editingIntel?intelRows.find(x=>x.id===editingIntel):null;const body={title:fTitle.value.trim(),classification:fClass.value,status:current?.status||'NOVO',priority:fPriority.value,target:fTarget.value.trim(),area:fArea.value.trim(),reliability:fReliability.value.trim(),summary:fSummary.value.trim(),content:fContent.value.trim(),tacticalNotes:fNotes.value.trim()};if(body.title.length<2)return showError('Informe o título.');await api(editingIntel?`/api/mercenary/intel/${editingIntel}`:'/api/mercenary/intel',{method:editingIntel?'PUT':'POST',body});showSuccess(editingIntel?'Informe atualizado.':'Informe criado.');closeIntelForm();loadIntel()}
async function setIntelStatus(id,status){await api(`/api/mercenary/intel/${id}/status`,{method:'POST',body:{status}});showSuccess('Status atualizado.');loadIntel()}
async function deleteIntel(id){if(!confirm('Excluir este informe permanentemente?'))return;await api(`/api/mercenary/intel/${id}`,{method:'DELETE'});showSuccess('Informe excluído.');loadIntel()}
async function loadIntel(){intelRows=await api('/api/mercenary/intel')||[];iNew.textContent=intelRows.filter(x=>x.status==='NOVO').length;iAnalysis.textContent=intelRows.filter(x=>x.status==='ANALISANDO').length;iConfirmed.textContent=intelRows.filter(x=>x.status==='CONFIRMADO').length;iArchived.textContent=intelRows.filter(x=>x.status==='ARQUIVADO').length;renderIntel()}
function renderIntel(){const q=(iSearch.value||'').toLowerCase().trim(),cf=iClassFilter.value,sf=iStatusFilter.value,pf=iPriorityFilter.value;const rows=intelRows.filter(r=>{const hay=[r.intel_code,r.title,r.subject,r.location,r.created_by_name].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!cf||r.category===cf)&&(!sf||r.status===sf)&&(!pf||r.extra?.priority===pf)});intelList.innerHTML=rows.map(r=>`<div class="intel-card"><div class="code">${escapeHtml(r.intel_code)}</div><h3 class="text-accent">${escapeHtml(r.title)}</h3><div><span class="badge ${r.category==='SIGILOSO'?'secret':r.category==='CONFIDENCIAL'?'conf':''}">${escapeHtml(r.category)}</span><span class="badge">${escapeHtml(r.status)}</span><span class="badge ${r.extra?.priority==='CRITICA'?'critical':r.extra?.priority==='ALTA'?'high':''}">PRIORIDADE ${escapeHtml(r.extra?.priority||'MEDIA')}</span></div><p><b>Alvo/Fonte:</b> ${escapeHtml(r.subject||'-')} &nbsp; <b>Área:</b> ${escapeHtml(r.location||'-')}</p><p><b>Confiabilidade:</b> ${escapeHtml(r.extra?.reliability||'-')}</p>${r.extra?.summary?`<div class="summary-box"><b>RESUMO</b><br>${escapeHtml(r.extra.summary)}</div>`:''}${r.description?`<p>${escapeHtml(r.description)}</p>`:''}${r.extra?.tacticalNotes?`<div class="tactical-note"><b>NOTAS TÁTICAS</b><br>${escapeHtml(r.extra.tacticalNotes)}</div>`:''}<small class="text-muted">Responsável: ${escapeHtml(r.created_by_name||r.created_by_username||'desconhecido')} • ${formatDateTime(r.updated_at)}</small><div class="intel-actions">${canEdit(r)?`<button class="btn-secondary w-auto" onclick='openIntelForm(${JSON.stringify(r).replace(/'/g,"&#39;")})'>EDITAR</button>${r.status!=='ANALISANDO'?`<button class="btn-warning w-auto" onclick="setIntelStatus(${r.id},'ANALISANDO')">ANALISAR</button>`:''}${r.status!=='CONFIRMADO'?`<button class="btn-success w-auto" onclick="setIntelStatus(${r.id},'CONFIRMADO')">CONFIRMAR</button>`:''}${r.status!=='ARQUIVADO'?`<button class="btn-secondary w-auto" onclick="setIntelStatus(${r.id},'ARQUIVADO')">ARQUIVAR</button>`:''}`:''}${isLeader()?`<button class="btn-danger w-auto" onclick="deleteIntel(${r.id})">EXCLUIR</button>`:''}</div></div>`).join('')||'<div class="card">Nenhum informe encontrado.</div>'}
</script></body></html>
