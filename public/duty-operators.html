<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="special-factions.css"><title>Efetivo da Duty</title></head><body><nav id="mainNav"></nav><main class="sf-wrap duty-eff-wrap"><section class="sf-hero duty-eff-hero" data-code="DUTY // PERSONNEL"><div class="sf-kicker">REGISTRO MILITAR</div><h1 class="sf-title">QUADRO DE EFETIVO DA DUTY</h1><p class="sf-sub">Cadastro, triagem e acompanhamento dos agentes em operação na Zona.</p></section><section class="sf-stats duty-eff-stats"><div class="sf-stat"><b id="dutyStatTotal">0</b><span>AGENTES REGISTRADOS</span></div><div class="sf-stat"><b id="dutyStatVeteran">0</b><span>VETERANOS (REP ≥ 100)</span></div><div class="sf-stat"><b id="dutyStatBlack">0</b><span>RESTRIÇÕES INTERNAS</span></div><div class="sf-stat"><b id="dutyStatRecent">-</b><span>ÚLTIMO CADASTRO</span></div></section><section class="sf-panel duty-form-panel"><h2 class="sf-title duty-form-title" style="font-size:20px">NOVO REGISTRO DE STALKER</h2><form id="dutyStalkerForm" class="duty-stalker-form" onsubmit="event.preventDefault(); sfDutySaveStalker();"><input type="hidden" id="dutyEditId"><div class="duty-grid-three"><div><label>Nome Real</label><input id="dutyNome" required></div><div><label>Codinome</label><input id="dutyCodinome" required></div><div><label>Patente / Unidade</label><input id="dutyFaccao" placeholder="Ex: Sargento • Guarnição Bar" required></div></div><div class="duty-grid-three"><div><label>Área de Atuação Principal</label><input id="dutyArea" placeholder="Ex: Garbage, Agroprom"></div><div><label>Aliados Conhecidos</label><input id="dutyAliados" placeholder="Loners neutros, Duty Alpha..."></div><div><label>Inimigos Específicos</label><input id="dutyInimigos" placeholder="Freedom, bandidos, mutantes..."></div></div><details class="duty-diplomacy"><summary>🛡️ Diplomacia e Relação com Facções</summary><div class="duty-diplomacy-grid"><div><label>Loners</label><select class="duty-rel" data-fac="Loners"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div><div><label>Freedom</label><select class="duty-rel" data-fac="Freedom"><option>Hostil</option><option>Neutro</option><option>Aliado</option></select></div><div><label>Mercenários</label><select class="duty-rel" data-fac="Mercenários"><option>Hostil</option><option>Neutro</option><option>Aliado</option></select></div><div><label>Bandidos</label><select class="duty-rel" data-fac="Bandidos"><option>Hostil</option><option>Neutro</option><option>Aliado</option></select></div><div><label>Ecologistas</label><select class="duty-rel" data-fac="Ecologistas"><option>Aliado</option><option>Neutro</option><option>Hostil</option></select></div><div><label>Militares</label><select class="duty-rel" data-fac="Militares"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div><div><label>Monolith</label><select class="duty-rel" data-fac="Monolith"><option>Hostil</option><option>Neutro</option><option>Aliado</option></select></div><div><label>Clear Sky</label><select class="duty-rel" data-fac="Clear Sky"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div></div></details><div><label>Notas de Comando / Rumores</label><textarea id="dutyRumores" rows="3" placeholder="Observações táticas, conduta, confiabilidade ou ordens específicas..."></textarea></div><div><label>Foto do Agente</label><input type="file" id="dutyFoto" accept="image/*"></div><div class="sf-actions"><button class="btn-success" type="submit">SALVAR NO BANCO DE DADOS</button><button class="btn-secondary" type="button" id="dutyCancelBtn" onclick="sfDutyResetForm()" style="display:none">CANCELAR EDIÇÃO</button></div></form></section><div class="sf-toolbar duty-toolbar"><input id="dutySearch" placeholder="🔎 Buscar por codinome, nome ou setor..." oninput="sfDutyRenderStalkers()"><select id="dutyOrder" onchange="sfDutyRenderStalkers()"><option value="id_desc">↓ Últimos cadastrados</option><option value="id_asc">↑ Primeiros cadastrados</option><option value="rep_desc">⭐ Maior reputação</option><option value="rep_asc">⚑ Menor reputação</option><option value="alpha_asc">A-Z Codinome</option><option value="alpha_desc">Z-A Codinome</option></select></div><section id="dutyStalkerList" class="duty-stalker-list"></section></main><script>window.SF_PAGE={faction:'duty',module:'operators'};</script><script src="app.js"></script><script src="special-factions.js"></script><script>sfDutyOperators();</script></body></html>
