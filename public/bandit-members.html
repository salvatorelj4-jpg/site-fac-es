<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="special-factions.css">
<title>GANGUE</title>
</head>
<body>
<nav id="mainNav"></nav>
<main class="sf-wrap roster-wrap roster-bandit">
<section class="sf-hero roster-hero" data-code="BANDITS // PERSONNEL">
<div class="sf-kicker">BLACK MARKET / ARQUIVO DA GANGUE</div>
<h1 class="sf-title">GANGUE</h1>
<p class="sf-sub">Cadastro interno dos membros, contatos, influência e histórico dentro do covil.</p>
</section>

<section class="sf-stats roster-stats">
<div class="sf-stat"><b id="rosterTotal">0</b><span>REGISTROS</span></div>
<div class="sf-stat"><b id="rosterStat2">0</b><span>REP ≥ 100</span></div>
<div class="sf-stat"><b id="rosterStat3">0</b><span>PROBLEMAS INTERNOS</span></div>
<div class="sf-stat"><b id="rosterRecent">-</b><span>ÚLTIMO CADASTRO</span></div>
</section>

<section class="sf-panel roster-form-panel">
<h2 class="sf-title roster-form-title" style="font-size:20px">NOVO REGISTRO</h2>
<form id="rosterForm" class="roster-form" onsubmit="event.preventDefault(); sfRosterSave();">
<input type="hidden" id="rosterEditId">

<div class="roster-grid-three">
<div><label>Nome Real</label><input id="rosterName" required></div>
<div><label>Codinome / Apelido</label><input id="rosterCode" required></div>
<div><label>Função na Gangue</label><input id="rosterRole" required></div>
</div>

<div class="roster-grid-three">
<div><label>Território / Área de Atuação</label><input id="rosterArea"></div>
<div><label>Parceiros / Contatos</label><input id="rosterAllies"></div>
<div><label>Rivais / Alvos</label><input id="rosterEnemies"></div>
</div>

<details class="roster-relations">
<summary>◈ Relação com outras facções</summary>
<div class="roster-relations-grid">
<div><label>Loners</label><select class="roster-rel" data-fac="Loners"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Duty</label><select class="roster-rel" data-fac="Duty"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Freedom</label><select class="roster-rel" data-fac="Freedom"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Mercenários</label><select class="roster-rel" data-fac="Mercenários"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Bandidos</label><select class="roster-rel" data-fac="Bandidos"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Ecologistas</label><select class="roster-rel" data-fac="Ecologistas"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Militares</label><select class="roster-rel" data-fac="Militares"><option>Neutro</option><option>Aliado</option><option>Hostil</option></select></div>
<div><label>Monolith</label><select class="roster-rel" data-fac="Monolith"><option>Hostil</option><option>Neutro</option><option>Aliado</option></select></div>
</div>
</details>

<div><label>Dívidas, reputação interna, favores, comportamento e observações do chefe...</label><textarea id="rosterNotes" rows="3"></textarea></div>
<div><label>Foto</label><input type="file" id="rosterPhoto" accept="image/*"></div>

<div class="sf-actions">
<button class="btn-success" type="submit">SALVAR NO BANCO DE DADOS</button>
<button class="btn-secondary" type="button" id="rosterCancel" onclick="sfRosterReset()" style="display:none">CANCELAR EDIÇÃO</button>
</div>
</form>
</section>

<div class="sf-toolbar roster-toolbar">
<input id="rosterSearch" placeholder="🔎 Buscar nome, codinome ou área..." oninput="sfRosterRender()">
<select id="rosterOrder" onchange="sfRosterRender()">
<option value="id_desc">↓ Últimos cadastrados</option>
<option value="id_asc">↑ Primeiros cadastrados</option>
<option value="rep_desc">⭐ Maior reputação</option>
<option value="rep_asc">⚑ Menor reputação</option>
<option value="alpha_asc">A-Z Codinome</option>
<option value="alpha_desc">Z-A Codinome</option>
</select>
</div>

<section id="rosterList" class="roster-list"></section>
</main>

<script>
window.SF_PAGE={
 faction:'bandits',
 roster:{
   theme:'bandit',
   roleLabel:'Função na Gangue',
   stat2:'REP ≥ 100',
   stat3:'PROBLEMAS INTERNOS'
 }
};
</script>
<script src="app.js"></script>
<script src="special-factions.js"></script>
<script>sfFactionRoster();</script>
</body>
</html>
