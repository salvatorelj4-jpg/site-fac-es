<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Arquivo Científico</title>
</head>
<body onload="checkAuth(); carregarPesquisas()">
    <nav id="mainNav"></nav>

    <div class="container">
        <div class="pda-ui">
            <h3 class="pda-title">CATALOGAR DESCOBERTA CIENTÍFICA</h3>
            <form id="formPesquisa" onsubmit="salvarPesquisa(event)">
                <input type="hidden" id="editPesquisaId">
                <div class="pda-grid">
                    <div class="pda-input-group" style="flex:2">
                        <label>NOME DA ENTIDADE (EX: ARTEFATO MEDUSA, BLOODSUCKER)</label>
                        <input type="text" id="pTitulo" name="titulo" placeholder="Identificação" required>
                    </div>
                    <div class="pda-input-group" style="flex:1">
                        <label>CLASSIFICAÇÃO</label>
                        <select id="pClass" name="classificacao" required class="pda-select">
                            <option value="artefato">Artefato</option>
                            <option value="mutante">Mutante</option>
                            <option value="anomalia">Anomalia Espacial</option>
                            <option value="tecnologia">Tecnologia Experimental</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top:20px;">
                    <div id="editor-container"></div>
                    <textarea id="pDesc" name="descricao" style="display:none;" required></textarea>
                </div>
                
                <div class="pda-input-group" style="margin-top:15px;">
                    <label>FOTO/ESQUEMA DO ARQUIVO (OPCIONAL):</label>
                    <input type="file" name="foto" style="border: 1px dashed #333 !important; padding: 15px !important; background: transparent !important;">
                </div>

                <div style="display:flex; justify-content: flex-end; gap:10px; margin-top:20px; border-top: 1px solid #333; padding-top: 20px;">
                    <button type="button" id="btnCancelarPesquisa" onclick="cancelarEdicaoPesquisa()" class="pda-btn-secondary" style="display:none;">CANCELAR</button>
                    <button type="submit" id="btnSalvarPesquisa" class="pda-btn">ARQUIVAR DESCOBERTA</button>
                </div>
            </form>
        </div>

        <h3 style="margin-top:40px; border-bottom:1px solid #333; padding-bottom:10px; color:#a5b396; font-family:'Share Tech Mono', monospace;">COMPÊNDIO DE PESQUISA DE YANTAR</h3>
        
        <div id="listaPesquisas"></div>
    </div>

    <div id="modalPerfil" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="border-color: #f1c40f; box-shadow: 0 0 40px rgba(241, 196, 15, 0.2);">
            <span class="fechar-modal" onclick="document.getElementById('modalPerfil').style.display='none'">&times;</span>
            <div id="conteudoPerfil"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script src="script.js"></script>

    <!-- Quill JS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        /* TEMA PDA S.T.A.L.K.E.R. PARA O EDITOR */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body, .container {
            background-color: #0b0c0d !important;
            font-family: 'Share Tech Mono', monospace !important;
        }

        .pda-ui {
            background: #121314;
            border: 1px solid #2a2e2a;
            border-radius: 4px;
            padding: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            font-family: 'Share Tech Mono', monospace;
        }

        .pda-title {
            color: #a5b396;
            margin-top: 0;
            border-bottom: 2px solid #2a2e2a;
            padding-bottom: 10px;
            font-weight: normal;
            font-size: 1.3em;
        }

        .pda-grid {
            display: flex;
            gap: 20px;
        }

        .pda-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pda-input-group label {
            color: #778466;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .pda-input-group input, .pda-input-group select {
            background: #0f1011 !important;
            border: 1px solid #333 !important;
            color: #a5b396 !important;
            padding: 10px !important;
            font-family: 'Share Tech Mono', monospace !important;
        }

        .pda-btn {
            background: #2a3622 !important;
            color: #a5b396 !important;
            border: 1px solid #4a5c40 !important;
            font-family: 'Share Tech Mono', monospace !important;
            padding: 10px 20px !important;
            width: auto !important;
        }
        
        .pda-btn:hover {
            background: #3e5033 !important;
            color: #fff !important;
        }

        .pda-btn-secondary {
            background: transparent !important;
            color: #888 !important;
            border: 1px solid #333 !important;
            font-family: 'Share Tech Mono', monospace !important;
            padding: 10px 20px !important;
            width: auto !important;
        }

        .ql-toolbar.ql-snow {
            background: #181a1b;
            border: 1px solid #333 !important;
            border-bottom: 2px solid #4a5c40 !important;
            border-radius: 4px 4px 0 0;
            padding: 8px !important;
        }
        .ql-container.ql-snow {
            background: #0f1011;
            border: 1px solid #333 !important;
            border-top: none !important;
            border-radius: 0 0 4px 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.05rem;
            color: #a5b396; /* Verde desbotado estilo terminal */
        }
        
        /* Ícones da Toolbar */
        .ql-snow .ql-stroke { stroke: #888; }
        .ql-snow .ql-fill { fill: #888; }
        .ql-snow .ql-picker { color: #888; }
        .ql-snow.ql-toolbar button:hover .ql-stroke, 
        .ql-snow .ql-toolbar button:hover .ql-stroke, 
        .ql-snow.ql-toolbar button.ql-active .ql-stroke, 
        .ql-snow .ql-toolbar button.ql-active .ql-stroke {
            stroke: #a5b396 !important;
        }
        .ql-snow.ql-toolbar button:hover .ql-fill, 
        .ql-snow .ql-toolbar button:hover .ql-fill, 
        .ql-snow.ql-toolbar button.ql-active .ql-fill, 
        .ql-snow .ql-toolbar button.ql-active .ql-fill {
            fill: #a5b396 !important;
        }

        .ql-editor { 
            min-height: 400px; 
            padding: 20px;
            font-family: 'Share Tech Mono', monospace !important;
            font-size: 1.1rem !important;
            color: #a5b396 !important;
        }

        .ql-editor.ql-blank::before {
            color: rgba(165, 179, 150, 0.4) !important;
            font-family: 'Share Tech Mono', monospace !important;
            font-style: italic;
        }
        
        /* Elementos dentro do editor */
        .ql-editor h1, .ql-editor h2, .ql-editor h3 {
            color: #e67e22 !important; /* Laranja de aviso */
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-weight: normal;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace !important;
        }
        
        .ql-editor blockquote {
            background: rgba(230, 126, 34, 0.05) !important;
            border-left: 4px solid #e67e22 !important;
            border-radius: 0 4px 4px 0 !important;
            padding: 15px !important;
            margin: 15px 0 !important;
            color: #d35400 !important;
            font-style: normal !important;
            font-family: 'Share Tech Mono', monospace !important;
        }
        
        .ql-editor pre.ql-syntax {
            background: #080808;
            border: 1px solid #222;
            border-left: 3px solid #a5b396;
            color: #a5b396;
            padding: 15px;
            margin: 15px 0;
        }

        .ql-editor img { max-width: 100%; border-radius: 2px; border: 1px solid #333; opacity: 0.9; }
        
        /* Style the HTML output when viewed in the list */
        .pesquisa-desc-html h1, .pesquisa-desc-html h2 { color: #e67e22; margin-top: 10px; font-family: 'Share Tech Mono', monospace; }
        .pesquisa-desc-html ul, .pesquisa-desc-html ol { margin-left: 20px; margin-bottom: 10px; font-family: 'Share Tech Mono', monospace; color:#a5b396; }
        .pesquisa-desc-html { font-family: 'Share Tech Mono', monospace; color: #a5b396; }
    </style>
    <script>
        const quillEnc = new Quill('#editor-container', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['blockquote', 'code-block', 'link', 'image'],
                    ['clean']
                ]
            },
            placeholder: 'Descrição detalhada da anatomia, propriedades radiológicas, fraquezas...'
        });

        // Sync Quill to textarea on form submit
        const formPesquisa = document.getElementById('formPesquisa');
        formPesquisa.addEventListener('submit', function(e) {
            const html = quillEnc.root.innerHTML;
            if (html === '<p><br></p>') {
                e.preventDefault();
                alert('A descrição não pode estar vazia.');
                return;
            }
            document.getElementById('pDesc').value = html;
        });

        // Override prepararEdicao to populate Quill
        const originalPreparar = window.prepararEdicaoPesquisa;
        window.prepararEdicaoPesquisa = function(id) {
            originalPreparar(id);
            const p = window.pesquisasAtuais.find(x => x.id === id);
            if (p) {
                quillEnc.root.innerHTML = p.descricao || '';
            }
        };

        // Override render format so HTML renders correctly in the list instead of text
        const originalRender = window.renderizarPesquisas;
        if (originalRender) {
            window.renderizarPesquisas = function(dados) {
                originalRender(dados);
                // The original render puts p.descricao directly into a <p> tag which escapes HTML.
                // We need to find those <p> tags and set innerHTML.
                // Actually, script.js uses template literals. Let's just fix it globally by patching script.js renderizarPesquisas.
            }
        }
    </script>
</body>
</html>
