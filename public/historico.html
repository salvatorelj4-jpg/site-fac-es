<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>Histórico</title></head>
<body onload="checkAuth(); carregarLogs()">
    <nav id="mainNav"></nav>
    <div class="container">
        
        <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px;">
            <h2 style="margin:0;">Arquivos de Monitoramento</h2>
            
            <div style="display:flex; gap:10px; align-items:center;">
                <label style="color:var(--accent); font-weight:bold; margin:0;">Filtrar Dia:</label>
                <input type="date" id="filtroData" onchange="carregarLogs()" style="width:auto; margin:0; padding:5px;">
            </div>
        </div>

        <div id="logs"></div>
    </div>
    <script src="app.js"></script>
    <script src="script.js"></script>
</body>
</html>
